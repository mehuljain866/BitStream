name: Build Standalone Executables (Windows, macOS, Linux)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    name: Regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 python3-tk
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests -v

  build-windows:
    name: Build on Windows
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build Windows executable
        run: pyinstaller --noconfirm --clean --name BitStream-Windows --onefile --windowed --collect-all PySide6 --collect-all shiboken6 --collect-all cv2 main.py
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: BitStream-Windows
          path: dist/BitStream-Windows.exe

  build-linux:
    name: Build on Linux
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libxcb-cursor0 libxkbcommon-x11-0 python3-tk
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build Linux executable
        run: pyinstaller --noconfirm --clean --name BitStream-Linux --onefile --collect-all PySide6 --collect-all shiboken6 --collect-all cv2 main.py
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: BitStream-Linux
          path: dist/BitStream-Linux

  build-macos:
    name: Build on macOS
    needs: tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build macOS app
        run: pyinstaller --noconfirm --clean --name BitStream-macOS --windowed --collect-all PySide6 --collect-all shiboken6 --collect-all cv2 main.py
      - name: Package macOS app
        run: cd dist && zip -r BitStream-macOS.zip BitStream-macOS.app
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: BitStream-macOS
          path: dist/BitStream-macOS.zip

  release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Flatten release assets
        run: |
          mkdir -p release-dist
          find release-assets -type f -exec cp {} release-dist/ \;
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-dist/*
          generate_release_notes: true
