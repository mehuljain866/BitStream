name: Build Standalone Executables (Windows, macOS, Linux)

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build on Windows
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows Executable
        run: pyinstaller --name "BitStream-Windows" --onefile --windowed --collect-all customtkinter main.py

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BitStream-Windows.exe
          path: dist/BitStream-Windows.exe

  build-linux:
    name: Build on Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 python3-tk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Linux Binary
        run: pyinstaller --name "BitStream-Linux" --onefile --collect-all customtkinter main.py

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BitStream-Linux
          path: dist/BitStream-Linux

  build-macos:
    name: Build on macOS
    runs-on: macos-13
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build macOS Binary
        run: |
          pyinstaller --name "BitStream-macOS" --onefile --windowed --collect-all customtkinter main.py
          cd dist
          zip -r BitStream-macOS.zip BitStream-macOS.app || zip -r BitStream-macOS.zip BitStream-macOS

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BitStream-macOS.zip
          path: dist/BitStream-macOS.zip

  release:
    name: Publish Release Assets
    needs: [build-windows, build-linux]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Prepare release files
        run: |
          mkdir -p release-dist
          if [ -d "release-artifacts" ]; then
            find release-artifacts -maxdepth 1 -type f -exec cp {} release-dist/ \;
          fi
          ls -lh release-dist/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: "BitStream v1.0.0 — Standalone Executables"
          files: release-dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
