name: Build Standalone Executables (Windows, macOS, Linux)

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: BitStream-Windows.exe
            build_cmd: pyinstaller --name "BitStream-Windows" --onefile --windowed --collect-all customtkinter main.py
            output_path: dist/BitStream-Windows.exe
            experimental: false
          - os: ubuntu-latest
            artifact_name: BitStream-Linux
            build_cmd: pyinstaller --name "BitStream-Linux" --onefile --collect-all customtkinter main.py
            output_path: dist/BitStream-Linux
            experimental: false
          - os: macos-latest
            artifact_name: BitStream-macOS.zip
            build_cmd: |
              pyinstaller --name "BitStream-macOS" --onefile --windowed --collect-all customtkinter main.py
              cd dist
              zip -r BitStream-macOS.zip BitStream-macOS.app || zip -r BitStream-macOS.zip BitStream-macOS
            output_path: dist/BitStream-macOS.zip
            experimental: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 python3-tk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Executable with PyInstaller
        shell: bash
        run: ${{ matrix.build_cmd }}

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.output_path }}
          if-no-files-found: error

  release:
    name: Publish Release Assets
    needs: build
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Prepare release files
        run: |
          mkdir -p release-dist
          if [ -d "release-artifacts" ]; then
            find release-artifacts -maxdepth 1 -type f -exec cp {} release-dist/ \;
          fi
          ls -lh release-dist/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'BitStream v1.0.0 — Standalone Executables' }}
          files: release-dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
